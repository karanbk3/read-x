
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect | Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js" defer></script>
<script src="./book.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header class="brand-bar">
        <h1 class="brand">Connect</h1>
    </header>

    <!-- MAIN LOGIN AREA -->
    <main class="page">

        <section class="login-container">

            <h2>Log in to Connect</h2>

            <form id="loginForm" class="login-form">

                <div class="form-group">
                    <label for="email" class="sr-only">
                        Email address or mobile number
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Email address or mobile number"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="sr-only">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="errorMessage"
                    class="error-message"
                    aria-live="polite">
                </p>

                <button
                    type="submit"
                    class="login-button">
                    Log in
                </button>

            </form>

            <a href="#" class="forgot-link">
                Forgot password?
            </a>

            <div class="separator"></div>

            <a href="signup.html" class="create-account">
                Create new account
            </a>

            <p class="community-label">
                Connect Community
            </p>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <nav class="footer-links">

            <a href="#">About</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>

        </nav>

        <p>
            Connect © 2026. All rights reserved.
        </p>

    </footer>

</body>
</html>
